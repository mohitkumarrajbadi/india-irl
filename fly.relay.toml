# Deploy from repo root:
#   fly deploy -c fly.relay.toml --ha=false

app = "ommo-relay"
primary_region = "sin"

[build]
  dockerfile = "server/Dockerfile"
  ignorefile = ".dockerignore"

[env]
  NODE_ENV = "production"
  MAX_PER_ROOM = "60"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "10s"
    method = "GET"
    path = "/health"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1

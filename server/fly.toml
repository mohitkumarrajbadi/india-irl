# Fly.io config for the OMMO WebSocket relay.
# Deploy from repo root: fly deploy -c server/fly.toml

app = "ommo-relay"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  MAX_PER_ROOM = "60"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "5s"
    method = "GET"
    path = "/health"
